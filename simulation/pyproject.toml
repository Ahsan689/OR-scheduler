[project]
name = "orflow-sim"
version = "0.1.0"
description = "ORFlow synthetic data generator and schedule simulation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orsim*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["orsim", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["orsim", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
